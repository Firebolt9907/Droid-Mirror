[package]
name = "droidmirror-bluetooth"
version = "0.1.0"
edition = "2024"
publish = false
description = "Linux Bluetooth transport helper for DroidMirror (BlueZ port of the macOS DroidMirrorBluetooth helper)"

[[bin]]
name = "droidmirror-bluetooth"
path = "src/main.rs"

[dependencies]
anyhow = "1"
aes = "0.8"
ctr = "0.9"
hmac = "0.12"
sha2 = "0.10"
aes-gcm = "0.10"
base64 = "0.22"
rand = "0.8"
serde_json = "1"
libc = "0.2"
bluer = { version = "0.17", features = ["bluetoothd", "l2cap"] }
tokio = { version = "1", features = ["rt", "rt-multi-thread", "net", "io-util", "io-std", "sync", "time", "macros", "signal"] }
futures = "0.3"
uuid = "1"
droidmirror-peer = { path = "../../PeerTransport" }

[build-dependencies]
cc = "1"
pkg-config = "0.3"

[profile.release]
opt-level = 3
