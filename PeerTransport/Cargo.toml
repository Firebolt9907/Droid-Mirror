[package]
name = "droidmirror-peer"
version = "0.1.0"
edition = "2024"
rust-version = "1.91"
publish = false

[lib]
name = "droidmirror_peer"
crate-type = ["cdylib", "rlib"]

[dependencies]
anyhow = "1"
hmac = "0.12"
iroh = { version = "=1.3.0", default-features = false, features = ["tls-ring"] }
iroh-mdns-address-lookup = "=0.6.0"
sha2 = "0.10"
tokio = { version = "1", features = ["rt-multi-thread", "net", "io-util", "sync", "time", "macros"] }
zeroize = "1"

[target.'cfg(target_os = "android")'.dependencies]
jni = "0.21"
ndk-context = "0.1"
