plugins {
    id 'com.android.application' version '8.9.1'
    id 'org.jetbrains.kotlin.android' version '2.3.20'
}
android {
    namespace 'app.droidmirror.bluetooth'
    buildFeatures { aidl true }
    compileSdk 36
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    sourceSets {
        main.java.srcDirs += '../scrcpy-5.0/server/src/main/java'
        main.aidl.srcDirs += '../scrcpy-5.0/server/src/main/aidl'
        main.jniLibs.srcDirs += "$buildDir/iroh-jni"
    }
    defaultConfig {
        applicationId 'app.droidmirror.bluetooth'
        minSdk 26
        targetSdk 35
        versionCode 26
        versionName '0.26'
    }
}

dependencies {
    compileOnly 'androidx.annotation:annotation:1.3.0'
    implementation 'dev.rikka.shizuku:api:13.1.5'
    implementation 'dev.rikka.shizuku:provider:13.1.5'
}

kotlin { compilerOptions { jvmTarget = org.jetbrains.kotlin.gradle.dsl.JvmTarget.JVM_17 } }

tasks.register('buildPeerTransport', Exec) {
    inputs.dir('../PeerTransport/src')
    inputs.file('../PeerTransport/Cargo.toml')
    inputs.file('../PeerTransport/Cargo.lock')
    inputs.file('../tools/build-peer-android.py')
    inputs.property('abis', System.getenv('DROIDMIRROR_ANDROID_ABIS') ?: 'arm64-v8a')
    outputs.dir("$buildDir/iroh-jni")
    environment 'ANDROID_HOME', android.sdkDirectory.absolutePath
    commandLine 'python3', '../tools/build-peer-android.py', "$buildDir/iroh-jni"
}
tasks.named('preBuild').configure { dependsOn 'buildPeerTransport' }
